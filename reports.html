<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Home</a>
        <a class="navbar-brand" href="reports.html">reports</a>
      </nav>
    <div class="container mt-4">
        <h2 class="text-center">Sales Reports</h2>

        <label for="date-filter">Select Date:</label>
        <input type="date" id="date-filter" class="form-control mb-3" onchange="loadSales()">

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Bill Number</th>
                    <th>Grand Total ($)</th>
                </tr>
            </thead>
            <tbody id="sales-records">
                <!-- Sales records will be dynamically inserted here -->
            </tbody>
        </table>

        <h3>Most Sold Items Graph</h3>
        <canvas id="salesChart" width="400" height="200"></canvas>
    </div>

    <script src="report_script.js"></script>
</body>
</html>
