<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Billing System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- <style>

    </style> -->
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Home</a>
        <a class="navbar-brand" href="reports.html">reports</a>
      </nav>
    <!-- <a href="reports.html">hello</a> -->
    <div class="container mt-4">
        <h2 class="text-center">Restaurant Billing System</h2>
        <div class="help-icon" data-bs-toggle="tooltip" data-bs-placement="left" title="Help"
        onclick="scrollToBottom()">
        <i class="fa-solid fa-arrow-down"></i>
    </div>
        <div id="menu-items"  class="container d-">
            <!-- Items will be dynamically loaded here -->
        </div>

        <h3 class="mt-4">Bill</h3>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bill-items">
                <!-- Selected items will be shown here -->
            </tbody>
        </table>
        <h4 class="text-end">Grand Total: <span id="grand-total">0</span></h4>
        <button class="btn btn-primary" onclick="printBill()">Print Bill</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
